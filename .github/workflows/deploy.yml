name: Deploy Application

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-production:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Create environment files
        run: |
          cat > .env.prod << EOF
          ALCHEMY_STAGE=prod
          EOF

          cat > apps/web/.env.prod << EOF
          VITE_SERVER_URL=${{ vars.VITE_SERVER_URL }}
          VITE_WEB_URL=${{ vars.VITE_WEB_URL }}
          CUSTOM_WEB_DOMAIN=${{ vars.CUSTOM_WEB_DOMAIN }}
          EOF

          cat > apps/server/.env.prod << EOF
          CORS_ORIGIN=${{ vars.CORS_ORIGIN }}
          BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL }}
          API_ROUTE_PATTERN=${{ vars.API_ROUTE_PATTERN }}
          EOF
      - name: Migrate Database
        run: bun db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy to Production
        run: bun alchemy deploy --stage prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-staging:
    if: ${{ github.ref == 'refs/heads/staging' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Create environment files
        run: |
          cat > .env.staging << EOF
          ALCHEMY_STAGE=staging
          EOF

          cat > apps/web/.env.staging << EOF
          VITE_SERVER_URL=${{ vars.VITE_SERVER_URL }}
          VITE_WEB_URL=${{ vars.VITE_WEB_URL }}
          CUSTOM_WEB_DOMAIN=${{ vars.CUSTOM_WEB_DOMAIN }}
          EOF

          cat > apps/server/.env.staging << EOF
          CORS_ORIGIN=${{ vars.CORS_ORIGIN }}
          BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL }}
          API_ROUTE_PATTERN=${{ vars.API_ROUTE_PATTERN }}
          EOF
      - name: Migrate Database
        run: bun db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy to Staging
        run: bun alchemy deploy --stage staging
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

