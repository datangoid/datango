# Workflow untuk cleanup preview environment setiap Pull Request yang ditutup
name: Clean Up Datango Pull Request

# Trigger: workflow ini berjalan pada Pull Request yang ditutup
on:
  pull_request:
    types:
      - closed      # PR ditutup/merge

# Concurrency control: mencegah cleanup paralel pada PR yang sama
concurrency:
  group: cleanup-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup-pr-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      # Step 1: Checkout kode
      - uses: actions/checkout@v4
      
      # Step 2: Setup Bun runtime
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      
      # Step 3: Install dependencies
      - name: Install dependencies
        run: bun install
      
      # Step 4: Hapus preview deployment dari Cloudflare
      # Ini akan menghapus workers, pages, dan custom domains
      # Continue on error agar DB cleanup tetap berjalan jika destroy gagal
      - name: Destroy PR Preview
        continue-on-error: true
        run: bun alchemy destroy --stage pr-${{ github.event.number }}
        env:
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          PULL_REQUEST: ${{ github.event.number }}
      
      # Step 5: Hapus database branch dari Neon
      # Menghemat resources dan biaya
      - name: Delete Neon DB Branch for PR
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview-pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
      
      # Step 6: Posting comment konfirmasi cleanup
      - name: Comment PR with cleanup message
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🧹 Preview Environment Cleaned Up\n\nPreview environment has been destroyed.\n\nDatabase branch has been destroyed.'
            });