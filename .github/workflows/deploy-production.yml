name: Deploy Datango Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-production-job:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Create environment files
        run: |
          cat > .env.prod << EOF
          ALCHEMY_STAGE=prod
          EOF

          cat > apps/web/.env.prod << EOF
          VITE_WEB_URL=${{ vars.WEB_URL }}
          VITE_WEB_DOMAIN=${{ vars.WEB_DOMAIN }}
          VITE_API_URL=${{ vars.API_URL }}
          VITE_API_DOMAIN=${{ vars.API_DOMAIN }}
          VITE_MAIN_URL=${{ vars.MAIN_URL }}
          VITE_MAIN_DOMAIN=${{ vars.MAIN_DOMAIN }}
          VITE_API_PATTERN=${{ vars.API_PATTERN }}
          EOF

          cat > apps/server/.env.prod << EOF
          MAIN_DOMAIN=${{ vars.MAIN_DOMAIN }}
          MAIN_URL=${{ vars.MAIN_URL }}
          API_DOMAIN=${{ vars.API_DOMAIN }}
          API_URL=${{ vars.API_URL }}
          WEB_DOMAIN=${{ vars.WEB_DOMAIN }}
          WEB_URL=${{ vars.WEB_URL }}
          API_PATTERN=${{ vars.API_PATTERN }}
          EOF

      - name: Migrate Database
        run: |
          cd packages/db
          bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Production
        run: bun alchemy deploy --stage prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
